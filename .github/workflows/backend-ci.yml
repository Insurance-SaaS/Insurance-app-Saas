name: Backend CI

on:
  push:
    paths:
      - 'insurance-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'insurance-backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks

      # Scans the checked-out tree. Switch to a full-history scan (drop --no-git)
      # once the leaked credentials have been purged from history.
      - name: Scan for secrets
        run: ./gitleaks detect --no-git --redact --no-banner --source .

  backend:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insurance-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: insurance-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (errors only)
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Starts Postgres, MariaDB and Redis through Testcontainers (Docker is preinstalled on the runner).
      - name: Integration tests
        run: npm run test:e2e

  image:
    name: Production image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: docker build -t insurance-backend ./insurance-backend

      - name: Runs as an unprivileged user
        run: test "$(docker run --rm insurance-backend id -u)" != "0"

      # Without settings the application must stop with its configuration report.
      # Getting that far proves the compiled code and the production dependencies
      # load inside the image; anything else (a missing module, a crash) fails here.
      - name: Starts far enough to check its configuration
        run: |
          set +e
          output="$(docker run --rm insurance-backend 2>&1)"
          status=$?
          echo "$output" | tail -n 25
          test "$status" -ne 0
          echo "$output" | grep -q "Invalid configuration"

      - name: Commands are present
        run: |
          docker run --rm insurance-backend node dist/cli/migrate.js | grep -q "Usage: migrate"
          docker run --rm insurance-backend node dist/cli/platform-admin.js | grep -q "Usage: platform-admin"
