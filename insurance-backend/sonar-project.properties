# SonarQube analysis of the backend.
#   npm run test:cov:all        (unit and integration coverage reports)
#   npx @sonar/scan -Dsonar.host.url=<server> -Dsonar.token=<token>
sonar.projectKey=insurance-backend
sonar.projectName=Insurance backend
sonar.sourceEncoding=UTF-8

sonar.sources=src,Dockerfile
sonar.exclusions=src/**/*.spec.ts
sonar.tests=src,test
sonar.test.inclusions=src/**/*.spec.ts,test/**/*.ts

sonar.typescript.tsconfigPaths=tsconfig.json
# Unit and integration tests each write a report; most request paths are only
# exercised by the integration tests.
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/e2e/lcov.info

# Not behaviour: wiring, schema declarations, request shapes, command-line glue.
sonar.coverage.exclusions=src/**/*.module.ts,src/**/*.entity.ts,src/**/dtos/**,src/**/*.dto.ts,src/database/migrations/**,src/cli/**,src/main.ts
